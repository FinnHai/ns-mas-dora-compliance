# NS-MAS Konfiguration
# Werte werden durch Umgebungsvariablen überschrieben

llm:
  provider: openai  # openai | anthropic | ollama
  model: gpt-4o-mini
  temperature: 0
  seed: 42

neo4j:
  uri: bolt://localhost:7688
  user: neo4j
  password: ""

rag:
  retriever_top_k: 40
  reranker_top_k: 3
  nvd_api_key: ""  # optional, für höheres NVD Rate-Limit

pipeline:
  max_auditor_iterations: 3
  human_review_required: true
